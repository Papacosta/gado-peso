server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Login (gerado por docker-entrypoint.d/30-auth.sh): cada requisição
    # protegida é conferida no backend pelo cookie de sessão. Sem sessão,
    # páginas vão para a tela de login e a API responde 401.
    include /etc/nginx/auth.inc;

    location = /_auth {
        internal;
        proxy_pass http://backend:8000/api/auth/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @unauth {
        if ($uri ~ ^/(api|photos)/) {
            return 401;
        }
        return 302 /login.html;
    }

    # Tela de login e rotas de entrar/sair: abertas.
    location = /login.html {
        auth_request off;
        add_header Cache-Control "no-store";
    }

    location ^~ /api/auth/ {
        auth_request off;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API e fotos: proxy para o backend (mesma origem -> sem CORS)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /photos/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
    }

    # PWA: service worker e manifest
    location = /sw.js {
        auth_request off;  # só código estático; sem dados
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # Arquivos para instalar o app na tela inicial e desenhar a tela de
    # login: o navegador os busca sem sessão. Não contêm nenhum dado.
    location ~ ^/(manifest\.webmanifest|pwa-[0-9]+\.png|apple-touch-icon\.png|favicon\.svg|robots\.txt|workbox-[A-Za-z0-9]+\.js)$ {
        auth_request off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

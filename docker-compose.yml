# Projeto PesoVivo. O nome fixo evita que o Docker crie um banco vazio se a
# pasta do projeto for renomeada ou clonada com outro nome.
name: pesovivo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gado}
      POSTGRES_DB: gado
    ports:
      # Só acessível no próprio Mac (não fica exposto na rede).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gado -d gado"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    restart: unless-stopped
    build:
      context: ./backend
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://gado:${POSTGRES_PASSWORD:-gado}@db:5432/gado
      DATA_DIR: /data
      PHOTOS_DIR: /data/photos
      MODELS_DIR: /data/models
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      MIN_ANIMALS_FOR_MODEL: ${MIN_ANIMALS_FOR_MODEL:-30}
      MIN_PHOTOS_PER_WEIGHING: ${MIN_PHOTOS_PER_WEIGHING:-3}
      MAX_PHOTOS_PER_WEIGHING: ${MAX_PHOTOS_PER_WEIGHING:-5}
      MAX_TILT_DEG: ${MAX_TILT_DEG:-5}
      MAX_FRAMES_PER_PASSAGE: ${MAX_FRAMES_PER_PASSAGE:-8}
      # Login do app (conferido pelo backend; ver routers/auth.py)
      APP_USER: ${APP_USER:-gado}
      APP_PASSWORD: ${APP_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SEGMENTATION_ENABLED: ${SEGMENTATION_ENABLED:-false}
      YOLO_WEIGHTS: ${YOLO_WEIGHTS:-yolov8n-seg.pt}
    volumes:
      # Volume persistente do banco é nomeado; fotos/modelos ficam em ./data.
      - ./data:/data
    ports:
      # API direta só no próprio Mac; celulares usam o frontend (com senha).
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      APP_USER: ${APP_USER:-gado}
      APP_PASSWORD: ${APP_PASSWORD:-}
    restart: unless-stopped
    ports:
      # HTTPS com certificado autoassinado: necessário para câmera/PWA no celular.
      - "5173:443"
    depends_on:
      - backend

  # Acesso remoto (celular fora de casa): link https público via Cloudflare
  # Tunnel, sem conta. Suba com:  docker compose --profile remoto up -d
  # O endereço aparece em:        docker compose logs tunnel | grep trycloudflare
  tunnel:
    image: cloudflare/cloudflared:2025.4.0
    profiles: ["remoto"]
    command: tunnel --no-autoupdate --url https://frontend:443 --no-tls-verify
    restart: unless-stopped
    depends_on:
      - frontend

  # Link FIXO e público via Tailscale. O endereço vem do hostname abaixo
  # (https://<hostname>.<sua-rede>.ts.net); trocar o hostname muda o link.
  # Funnel, gratuito. Requer conta Tailscale e TS_AUTHKEY no .env.
  # Suba com:  docker compose --profile fixo up -d
  # Na 1ª vez, ligue o Funnel (fica salvo no volume tsstate):
  #   docker compose exec funnel tailscale funnel --bg https+insecure://frontend:443
  funnel:
    image: tailscale/tailscale:v1.104.7
    profiles: ["fixo"]
    hostname: gado-peso
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: gado-peso
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      PUBLIC_URL: ${PUBLIC_URL:-}
    volumes:
      - tsstate:/var/lib/tailscale
    # Acessa o próprio link público a cada minuto: mantém as conexões do
    # Funnel "aquecidas" (sem isso o primeiro acesso após um tempo parado
    # pode falhar).
    healthcheck:
      test: ["CMD-SHELL", "[ -z \"$$PUBLIC_URL\" ] || wget -q -T 15 -O /dev/null \"$$PUBLIC_URL/manifest.webmanifest\""]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    depends_on:
      - frontend

# Os volumes guardam o nome antigo (gado-peso_*) de propósito: é onde já
# estão o banco e a identidade do link fixo. Não renomear sem migrar os dados.
volumes:
  pgdata:
    name: gado-peso_pgdata
  tsstate:
    name: gado-peso_tsstate
